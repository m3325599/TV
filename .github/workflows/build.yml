name: Build APK

on:
  push:
    branches: [ main, master, fongmi ]
  pull_request:
    branches: [ main, master, fongmi ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

env:
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [leanback, mobile]
        abi: [arm64_v8a]
        build_type: [debug, release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Python 3.10 (required by Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Python installation and create python3.10 symlink
        run: |
          python3 --version
          which python3
          python --version
          which python
          PYTHON_DIR=$(dirname $(which python3))
          if [ ! -f "$PYTHON_DIR/python3.10" ]; then
            ln -s "$PYTHON_DIR/python3" "$PYTHON_DIR/python3.10"
            echo "Created python3.10 symlink"
          fi
          python3.10 --version
          which python3.10

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-write-only: true

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate signing key for release
        if: matrix.build_type == 'release'
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=TV Box, OU=TV, O=TV, L=Beijing, ST=Beijing, C=CN"
          echo "storeFile=../release.keystore" >> local.properties
          echo "keyAlias=release" >> local.properties
          echo "storePassword=android" >> local.properties
          echo "keyPassword=android" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }}-${{ matrix.abi }} ${{ matrix.build_type }} APK
        run: |
          FLAVOR=$(echo "${{ matrix.flavor }}" | sed 's/^./\U&/')
          ABI=$(echo "${{ matrix.abi }}" | sed 's/^./\U&/')
          BUILD_TYPE_CAP=$(echo "${{ matrix.build_type }}" | sed 's/^./\U&/')
          TASK="assemble${FLAVOR}${ABI}${BUILD_TYPE_CAP}"
          echo "Running task: $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace
        env:
          JAVA_OPTS: -Xmx4g
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: List APK outputs
        if: success()
        run: |
          find app/build/outputs/apk -name "*.apk" -ls

      - name: Rename APK with run number
        if: success()
        run: |
          RUN_NUM=${{ github.run_number }}
          mkdir -p apk_output
          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            basename=$(basename "$apk")
            newname="tv-r${RUN_NUM}-${basename}"
            cp "$apk" "apk_output/$newname"
            echo "Renamed: $basename -> $newname"
          done
          ls -lh apk_output/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tv-${{ matrix.flavor }}-${{ matrix.abi }}-${{ matrix.build_type }}-r${{ github.run_number }}
          path: |
            apk_output/*.apk
          retention-days: 7
