name: Build APK

on:
  push:
    branches: [ main, master, fongmi ]
  pull_request:
    branches: [ main, master, fongmi ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug does not require signing)'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [leanback, mobile]
        abi: [arm64_v8a, armeabi_v7a]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Python 3.10 (required by Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-write-only: true

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Android SDK path: $ANDROID_HOME"
          ls -la $ANDROID_HOME/
          echo "---"
          echo "Installed platforms:"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms found"
          echo "---"
          echo "Installed build-tools:"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools found"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ${{ matrix.flavor }}-${{ matrix.abi }} APK
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          FLAVOR=$(echo "${{ matrix.flavor }}" | sed 's/^./\U&/')
          ABI=$(echo "${{ matrix.abi }}" | sed 's/^./\U&/')
          BUILD_TYPE_CAP=$(echo "$BUILD_TYPE" | sed 's/^./\U&/')
          TASK="assemble${FLAVOR}${ABI}${BUILD_TYPE_CAP}"
          echo "Running task: $TASK"
          ./gradlew "$TASK" --no-daemon --stacktrace
        env:
          JAVA_OPTS: -Xmx4g
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: List APK outputs
        if: success()
        run: |
          find app/build/outputs/apk -name "*.apk" -ls

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tv-${{ matrix.flavor }}-${{ matrix.abi }}-${{ inputs.build_type || 'debug' }}
          path: |
            app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.abi }}/${{ inputs.build_type || 'debug' }}/*.apk
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && inputs.build_type == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./apks

      - name: Display structure of downloaded files
        run: ls -laR ./apks

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: TV Release ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./apks/**/*.apk